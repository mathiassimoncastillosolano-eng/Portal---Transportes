spring.application.name=backend
spring.config.import=optional:file:./.env.properties

# Supabase Transaction Pooler: limita las conexiones de cada instancia.
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:6543/postgres?prepareThreshold=0&sslmode=require}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=20000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# ---------------------------------------------------------------------------
# Health checks: GET /api/health/live y GET /api/health/ready (Render + frontend).
# ---------------------------------------------------------------------------
# Tiempo máximo que /ready espera la comprobación de PostgreSQL (Connection.isValid).
salud.bd.timeout-ms=${SALUD_BD_TIMEOUT_MS:2500}
# Un éxito se reutiliza durante este tiempo: el polling de muchos clientes no agota el pool (3).
salud.bd.cache-ms=${SALUD_BD_CACHE_MS:10000}
# true: tras haber estado READY, una caída de Supabase responde 200 DEGRADED (Render no reinicia
# la instancia; el frontend sigue sin aceptar DEGRADED como listo).
salud.readiness.tolerar-caidas-bd=${SALUD_TOLERAR_CAIDAS_BD:true}

security.jwt.clave-secreta=${JWT_SECRET}
security.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:60}

# ---------------------------------------------------------------------------
# CORS: origen del frontend (Vite) que consumira la API durante el desarrollo.
# ---------------------------------------------------------------------------
seguridad.cors.origenes-permitidos=${CORS_ORIGENES:http://localhost:5173}

# Reserva de asientos: tiempo de bloqueo de un asiento en minutos antes de que
# se libere automaticamente si no se completa la reserva.
reserva.bloqueo-minutos=10

reserva.token-secreto=${RESERVA_TOKEN_SECRETO}

# Inicio de sesion con Google (Google Identity Services). El Client ID es publico.
# No se usa Client Secret: el ID token se verifica con las claves publicas de Google.
google.client-id=${GOOGLE_CLIENT_ID:634394270803-cq7r95msc42438ja1c5rf68v0ma1251i.apps.googleusercontent.com}

# ---------------------------------------------------------------------------
# Recuperacion de contrasena por correo. NO escribas aqui valores reales: usa
# variables de entorno o backend/.env.properties (ignorado por git).
# ---------------------------------------------------------------------------
# Secreto del servidor (>= 32 caracteres). Protege el hash del codigo y firma la prueba de verificacion.
recuperacion.secreto=${RECUPERACION_SECRETO}
recuperacion.codigo-minutos=${RECUPERACION_CODIGO_MINUTOS:10}
recuperacion.ventana-cambio-minutos=${RECUPERACION_VENTANA_CAMBIO_MINUTOS:10}
recuperacion.max-intentos=${RECUPERACION_MAX_INTENTOS:5}
recuperacion.reenvio-segundos=${RECUPERACION_REENVIO_SEGUNDOS:60}
recuperacion.max-solicitudes-hora=${RECUPERACION_MAX_SOLICITUDES_HORA:5}
recuperacion.max-solicitudes-ip=${RECUPERACION_MAX_SOLICITUDES_IP:10}
recuperacion.max-verificaciones-ip=${RECUPERACION_MAX_VERIFICACIONES_IP:30}
recuperacion.max-cambios-ip=${RECUPERACION_MAX_CAMBIOS_IP:20}

# Resend (correo transaccional). La clave nunca se versiona.
resend.api-key=${RESEND_API_KEY:}
resend.remitente=${RESEND_FROM:}
resend.url-base=${RESEND_API_URL:https://api.resend.com}

# Si el backend esta detras de un proxy/balanceador de confianza, define FORWARD_HEADERS_STRATEGY=framework
# para que los limites por IP usen la IP real del cliente (X-Forwarded-For) y no la del proxy.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# ---------------------------------------------------------------------------
# Mercado Pago - Checkout API via Orders (Peru). NO escribas aqui valores reales:
# define las variables en Render (o en backend/.env.properties, ignorado por git).
# ---------------------------------------------------------------------------
# Credenciales SEPARADAS por entorno. El backend elige el par correcto segun el entorno de cada operacion
# (SANDBOX o PRODUCTION); no hay que cambiar variables en Render para pasar de uno a otro.
# Los valores de SANDBOX siguen aceptando los nombres anteriores (MERCADOPAGO_ACCESS_TOKEN y
# MERCADOPAGO_WEBHOOK_SECRET) para no romper el despliegue actual.
#
# --- SANDBOX (credenciales de prueba) ---
mercadopago.sandbox.access-token=${MERCADOPAGO_SANDBOX_ACCESS_TOKEN:${MERCADOPAGO_ACCESS_TOKEN:}}
mercadopago.sandbox.public-key=${MERCADOPAGO_SANDBOX_PUBLIC_KEY:}
mercadopago.sandbox.webhook-secret=${MERCADOPAGO_SANDBOX_WEBHOOK_SECRET:${MERCADOPAGO_WEBHOOK_SECRET:}}
# id_usuario (separados por coma) que pueden usar Sandbox. Vacio = nadie. Se comprueba siempre en el backend.
mercadopago.sandbox.usuarios-autorizados=${MERCADOPAGO_SANDBOX_USUARIOS_AUTORIZADOS:}
# --- PRODUCTION (credenciales productivas: dinero REAL) ---
mercadopago.production.access-token=${MERCADOPAGO_PRODUCTION_ACCESS_TOKEN:}
mercadopago.production.public-key=${MERCADOPAGO_PRODUCTION_PUBLIC_KEY:}
mercadopago.production.webhook-secret=${MERCADOPAGO_PRODUCTION_WEBHOOK_SECRET:}
# Tolerancia opcional (segundos) entre el ts de la firma y el reloj del servidor; 0 = sin limite.
mercadopago.webhook-tolerancia-segundos=${MERCADOPAGO_WEBHOOK_TOLERANCIA_SEGUNDOS:0}
mercadopago.url-api=${MERCADOPAGO_API_URL:https://api.mercadopago.com}
mercadopago.timeout-segundos=${MERCADOPAGO_TIMEOUT_SEGUNDOS:20}
# Minutos que los asientos siguen bloqueados mientras se procesa el pago.
mercadopago.minutos-pago=${MERCADOPAGO_MINUTOS_PAGO:15}
# 3DS 2.0 para tarjetas: on_fraud_risk (recomendado) o never.
mercadopago.validacion-3ds=${MERCADOPAGO_VALIDACION_3DS:on_fraud_risk}
# SOLO Sandbox: correo de pagador de prueba exigido por Mercado Pago. En PRODUCTION se ignora siempre (se usa el correo real del comprador).
mercadopago.email-pagador-prueba=${MERCADOPAGO_EMAIL_PAGADOR_PRUEBA:}
# Nombres en la tabla metodo_pago (los crea la migracion 003).
# Documento del pagador (payer.identification). Ver INFORME: tipos enviables y mapeo explícito.
mercadopago.identificacion.tipos=${MERCADOPAGO_IDENTIFICACION_TIPOS:DNI}
mercadopago.identificacion.mapeo-tipos=${MERCADOPAGO_IDENTIFICACION_MAPEO:}
mercadopago.metodo-tarjeta=Mercado Pago - Tarjeta
mercadopago.metodo-yape=Mercado Pago - Yape

# Consulta de DNI en ApiPeru. El token solo existe en el servidor (nunca en VITE_*).
dni.apiperu.token=${DNI_API_TOKEN:}
dni.apiperu.url-base=${DNI_API_URL:https://apiperu.dev}

libro.proveedor.razon-social=${LIBRO_RAZON_SOCIAL:Transportes}
libro.proveedor.ruc=${LIBRO_RUC:10608894131}
libro.proveedor.direccion=${LIBRO_DIRECCION:}
libro.proveedor.telefono=${LIBRO_TELEFONO:}
libro.proveedor.correo=${LIBRO_CORREO:}
libro.max-registros-hora-ip=${LIBRO_MAX_REGISTROS_HORA_IP:10}
reclamos.secreto=${RECLAMOS_SECRETO:${RECUPERACION_SECRETO}}
