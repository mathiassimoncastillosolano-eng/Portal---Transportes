spring.application.name=backend
spring.config.import=optional:file:./.env.properties

# Supabase Transaction Pooler: limita las conexiones de cada instancia.
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:6543/postgres?prepareThreshold=0&sslmode=require}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=20000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
security.jwt.clave-secreta=${JWT_SECRET:R7k2pL9xQ4vT8mN1sB6wA3dF0h]5yC2eZ9uI4oP7rE1tY6qW3nM8gH0jK5xL2vD9}
security.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:60}
seguridad.cors.origenes-permitidos=${CORS_ORIGENES:http://localhost:5173}

# Inicio de sesion con Google (Google Identity Services). El Client ID es publico.
# No se usa Client Secret: el ID token se verifica con las claves publicas de Google.
google.client-id=${GOOGLE_CLIENT_ID:634394270803-cq7r95msc42438ja1c5rf68v0ma1251i.apps.googleusercontent.com}
