spring.datasource.url=jdbc:h2:mem:registro;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-test.sql
security.jwt.clave-secreta=clave-solo-para-pruebas-locales-sin-datos-reales-2026
security.jwt.expiracion-minutos=60
seguridad.cors.origenes-permitidos=http://localhost:5173
