<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RutaLibre — Agencia de transporte terrestre de pasajeros. Viaja cómodo, seguro y a tiempo a todo el país." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>RutaLibre — Tu próximo destino comienza aquí</title>
    <script>
      // Anti-parpadeo: fija el tema antes de que pinte el primer frame, para
      // que una recarga en modo oscuro no muestre un destello blanco.
      // Debe mantener la misma prioridad que leerTemaInicial() en ContextoTema.
      (function () {
        try {
          var guardado = localStorage.getItem('rutalibre:tema')
          var tema =
            guardado === 'light' || guardado === 'dark'
              ? guardado
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', tema)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
